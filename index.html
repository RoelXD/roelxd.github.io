<!DOCTYPE html>
<html>

  <head>

    <meta charset="utf-8">
    <title>RoelXD</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

      <script type="text/javascript">

        var ua = navigator.userAgent || "";
        var host = (window.location.hostname || "").toLowerCase();

        // Detect both old and New 3DS (and Wii U)

        var isnintendo =  (ua.indexOf("Nintendo 3DS") !== -1) ||
                          (ua.indexOf("New Nintendo 3DS") !== -1) ||
                          (ua.indexOf("Nintendo WiiU") !== -1);


        var target;

        if (isnintendo) {

          // Nintendo consoles always go to the nintendo page

          target = "nintendo";

        } else if (host === "roelxd.github.io") {

          // GitHub Pages address -> English page

          target = "html/english.html";

        } else

          target = "dashboard"

        window.location = target;

      </script>

    <noscript>

      <!-- Fallback if JS is disabled -->
      <meta http-equiv="refresh" content="0;url=html/nojs.html">

    </noscript>

  </head>

  <body>

    <p>Redirecting...</p>

  </body>

</html>
